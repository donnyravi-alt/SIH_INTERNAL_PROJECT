<style>
        .camera-overlay {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
        }

<body class="bg-black text-on-surface h-full w-full overflow-hidden flex flex-col relative font-sans">
<!-- Top Navigation App Bar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-container-padding-mobile h-touch-target-min bg-black/50 text-white backdrop-blur-sm">
<div class="flex items-center gap-2">
<button class="flex items-center justify-center w-touch-target-min h-touch-target-min rounded-full hover:bg-surface-container/20 transition-colors">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-white">FeedCheck</span>
</div>
<button class="flex items-center justify-center px-4 h-touch-target-min rounded-full hover:bg-surface-container/20 transition-colors font-label-lg text-label-lg text-primary-fixed">
            EN/TEL
        </button>
</header>
<!-- Camera Viewport (Simulated) -->
<main class="flex-1 relative flex flex-col items-center justify-center w-full h-full">
<div class="absolute inset-0 bg-cover bg-center w-full h-full z-0 opacity-70" data-alt="A close-up, high-quality photograph of a pile of mixed dairy cattle feed spread on a plain, light-colored surface, seen from a top-down perspective, imitating a camera viewfinder. The lighting is bright and even, simulating outdoor daylight, casting minimal shadows. The feed mixture is detailed and textured, showing grains and pellets clearly. The overall mood is utilitarian and agricultural, grounded in a modern-professional aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCP9ZsDHsu8prNAPBS24Kjzt6mFH8-CF9BwuEBmwD355dzwiIe_kUw3ZnuU5-Oi4H5dQeIf1diTFzC--hY_ohYaxfe6UI9rsyC2-g8h9v5b3N5NhvfIrzsaz_QCA9brhScjp7md-ew_P5lHrFdyNW-OfAXoA0mQHUFV58BhjvW7B2r_iOmFs5IkZjyjTcBX9g1U2CrRBaBQxks0ApxwaZxDXXU0bmh-mYByTUzsL3Kvqt0iVN92_4EL')"></div>
<!-- Camera Guide Overlay -->
<div class="absolute inset-0 z-10 flex flex-col items-center justify-center pointer-events-none">
<div class="text-center mb-6">
<p class="font-headline-md text-headline-md text-white bg-black/60 px-4 py-2 rounded-lg backdrop-blur-sm">Place feed inside the box</p>
<p class="font-body-md text-body-md text-white/80 mt-1">పెట్టెలో మేతను ఉంచండి</p>
</div>
<!-- The transparent reference box -->
<div class="w-64 h-64 clear-box rounded-xl relative flex items-center justify-center">
<!-- Corner markers for visual cue -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary-fixed rounded-tl-xl"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary-fixed rounded-tr-xl"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary-fixed rounded-bl-xl"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary-fixed rounded-br-xl"></div>
<span class="material-symbols-outlined text-primary-fixed/50" style="font-size: 48px; font-variation-settings: 'FILL' 1;">add</span>
</div>
</div>
</main>
<!-- Bottom Sheet / Controls -->
<section class="absolute bottom-0 w-full bg-surface rounded-t-3xl shadow-lg z-40 flex flex-col pt-6 pb-8 px-container-padding-mobile border-t border-outline-variant">
<!-- Instructions List -->
<div class="flex flex-col gap-unit mb-6 max-w-md mx-auto w-full">
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-primary mt-0.5" style="font-variation-settings: 'FILL' 1;">light_mode</span>
<div>
<p class="font-label-lg text-label-lg text-on-surface">1. Ensure bright light</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">ప్రకాశవంతమైన కాంతిని నిర్ధారించుకోండి</p>
</div>
</div>
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-primary mt-0.5" style="font-variation-settings: 'FILL' 1;">shadow</span>
<div>
<p class="font-label-lg text-label-lg text-on-surface">2. Avoid shadows</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">నీడలను నివారించండి</p>
</div>
</div>
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-primary mt-0.5" style="font-variation-settings: 'FILL' 1;">smartphone</span>
<div>
<p class="font-label-lg text-label-lg text-on-surface">3. Hold phone 1 foot away</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">ఫోన్‌ను 1 అడుగు దూరంలో ఉంచండి</p>
</div>
</div>
</div>

<div class="flex items-center justify-between mt-auto w-full max-w-md mx-auto relative h-24">
<button class="flex flex-col items-center justify-center w-touch-target-min h-touch-target-min text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">photo_library</span>
<span class="font-label-sm text-label-sm mt-1">Gallery</span>
</button>

<button class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 bg-primary rounded-full flex items-center justify-center shadow-lg border-4 border-surface outline outline-4 outline-primary hover:bg-primary-container transition-all active:scale-95 z-50">
<div class="w-16 h-16 bg-white rounded-full border-2 border-primary-fixed"></div>
</button>
<button class="flex flex-col items-center justify-center w-touch-target-min h-touch-target-min text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">flash_off</span>
<span class="font-label-sm text-label-sm mt-1">Flash</span>
</button>
</div>
</section>
